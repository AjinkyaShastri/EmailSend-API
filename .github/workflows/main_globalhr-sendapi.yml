name: Build and Deploy .NET Framework WebAPI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: 🔧 Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 📦 Restore NuGet packages
        run: nuget restore EmailSend-API.sln

      - name: 🏗️ Build solution
        run: msbuild EmailSend-API.sln /p:Configuration=Release

      - name: 📤 Publish WebApp
        run: msbuild EmailSend-API/EmailSend-API.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:publishUrl="$(Build.SourcesDirectory)\publish"

      - name: 🗂️ Verify publish folder
        run: |
          if (Test-Path "${{ github.workspace }}\publish") {
            Write-Host "✅ Publish folder created."
            Get-ChildItem "${{ github.workspace }}\publish"
          } else {
            Write-Error "❌ Publish folder NOT created by MSBuild."
          }
        shell: pwsh

      - name: 📦 Zip published files
        run: Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\WebApp.zip" -Force
        shell: pwsh

      - name: 🚀 Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI
          package: "${{ github.workspace }}\WebApp.zip"
          slot-name: production
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
