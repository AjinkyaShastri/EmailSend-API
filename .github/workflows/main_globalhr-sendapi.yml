name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main   # Change if needed

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3. Install .NET Framework 4.6.1 Developer Pack
      - name: Install .NET Framework 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GlobaHr-SendEmail-API.sln

      # 6. Build with MSBuild (force output to publish folder)
      - name: Build with MSBuild
        run: msbuild GlobaHr-SendEmail-API.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="$(Get-Location)\publish\\"
        shell: pwsh

      # 7. Archive files
      - name: Archive files
        run: Compress-Archive -Path publish\* -DestinationPath WebApp.zip
        shell: pwsh

      # 7. Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8. Deploy to Azure WebApp
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI
          package: ${{ github.workspace }}\WebApp.zip
