name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main   # change if using a different branch

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Install .NET Framework 4.6.1 Developer Pack
      - name: Install .NET Framework 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj -SolutionDirectory .

# 7. Publish project
- name: Publish project
  run: |
    msbuild GlobaHr-SendEmail-API/GlobaHr-SendEmail-API.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:publishUrl="${{ github.workspace }}/publish"

# 8. Zip published output
- name: Zip publish folder
  run: |
    cd ${{ github.workspace }}/publish
    powershell Compress-Archive * ../WebApp.zip

# 9. Deploy to Azure WebApp
- name: Deploy to Azure WebApp
  uses: azure/webapps-deploy@v3
  with:
    app-name: GlobalHr-SendAPI
    package: ${{ github.workspace }}/WebApp.zip
