name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3. Install .NET Framework 4.6.1 Developer Pack
      - name: Install .NET Framework 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore ".\GlobaHr-SendEmail-API.sln"

      # 6. Build and publish Web API to 'publish' folder
      - name: Build and Publish Web API
        run: |
          msbuild ".\GlobaHr-SendEmail-API.sln" `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:OutDir="${{ github.workspace }}\publish\" `
            /verbosity:detailed
        shell: pwsh

      # 7. List published files (debug)
      - name: List published files
        run: dir "${{ github.workspace }}\publish"
        shell: pwsh

      # 8. Archive published output
      - name: Archive published output
        run: Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\WebApp.zip"
        shell: pwsh

