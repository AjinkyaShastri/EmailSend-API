name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main   # Change if needed

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3. Install .NET Framework 4.6.1 Developer Pack
      - name: Install .NET Framework 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GlobaHr-SendEmail-API.sln

      # 6. Build with MSBuild (force output to publish folder)
      - name: Build with MSBuild
        run: msbuild GlobaHr-SendEmail-API.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="$(Get-Location)\publish\\"
        shell: pwsh

      # 7. Create publish folder
      - name: Prepare publish folder
        run: |
          if (Test-Path publish) { Remove-Item publish -Recurse -Force }
          New-Item -ItemType Directory -Path publish
        shell: pwsh

      # 8. Copy build output (adjust folder based on actual target framework)
      - name: Copy build output
        run: |
          $buildOutput = "$(Get-Location)\GlobaHr-SendEmail-API\bin\Release"
          if (Test-Path $buildOutput) {
            xcopy /Y /E "$buildOutput\*" publish\
          } else {
            Write-Error "Build output not found at $buildOutput"
          }
        shell: pwsh

      # 9. Archive files into WebApp.zip
      - name: Archive files
        run: Compress-Archive -Path publish\* -DestinationPath WebApp.zip
        shell: pwsh

      # 10. Azure login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 11. Deploy to Azure Web App
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI  # your App Service name
          package: WebApp.zip