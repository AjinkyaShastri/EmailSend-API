name: Build and Deploy .NET Framework Web API to Azure (Direct CLI Deploy)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3. Install .NET Framework Developer Pack (if needed)
      - name: Install .NET 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore ".\GlobaHr-SendEmail-API.sln"

      # 6. Build and publish Web API to local folder
      - name: Build and Publish Web API
        run: |
          msbuild ".\GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj" `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="${{ github.workspace }}\publish" `
            /verbosity:detailed
        shell: pwsh

      # 7. List published files (debug)
      - name: List published files
        run: dir "${{ github.workspace }}\publish"
        shell: pwsh

      # 8. Install Azure CLI
      - name: Setup Azure CLI
        uses: azure/setup-azure@v3

      # 9. Login to Azure using Service Principal
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 10. Deploy publish folder using Azure CLI
      - name: Deploy to Azure Web App via Azure CLI
        run: |
          az webapp deploy `
            --resource-group Global-Hr-API `
            --name GlobalHr-SendAPI `
            --src-path "${{ github.workspace }}\publish" `
            --type zip
        shell: pwsh
