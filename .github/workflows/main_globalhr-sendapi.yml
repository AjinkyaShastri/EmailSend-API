jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore .\GlobaHr-SendEmail-API.sln

      - name: Build and Publish Web API
        run: msbuild .\GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=true /p:publishUrl="$(Get-Location)\publish"
        shell: pwsh

      - name: Archive published output
        run: Compress-Archive -Path "$(Get-Location)\publish\*" -DestinationPath "$(Get-Location)\WebApp.zip"
        shell: pwsh

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI
          package: WebApp.zip
