name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3. Install .NET Framework Developer Pack
      - name: Install .NET 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore ".\GlobaHr-SendEmail-API.sln"

      # 6. Build and publish Web API
      - name: Build and Publish Web API
        run: |
          msbuild ".\GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj" `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="${{ github.workspace }}/publish" `
            /verbosity:detailed
        shell: pwsh

      # 7. Debug: check if publish folder exists
      - name: Debug publish folder
        run: |
          if (Test-Path "${{ github.workspace }}/publish") {
            Write-Host "✅ Publish folder created."
            dir "${{ github.workspace }}/publish"
          } else {
            Write-Error "❌ Publish folder NOT created by MSBuild."
          }
        shell: pwsh

      # 8. Archive published output
      - name: Archive published output
        run: |
          if (Test-Path "${{ github.workspace }}/publish") {
            Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath "${{ github.workspace }}/WebApp.zip" -Force
            Write-Host "✅ WebApp.zip created successfully."
          } else {
            Write-Error "❌ Publish folder missing, skipping zip."
          }
        shell: pwsh

      # 9. Azure Login (Service Principal JSON from secret)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 10. Deploy to Azure Web App
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI
          package: "${{ github.workspace }}/WebApp.zip"
