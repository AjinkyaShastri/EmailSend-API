name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore .\GlobaHr-SendEmail-API.sln

      - name: Build and Publish Web API
        run: |
          msbuild .\GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="${{ github.workspace }}\publish" `
            /verbosity:detailed
        shell: pwsh

      - name: List published files
        run: dir "${{ github.workspace }}\publish"
        shell: pwsh

      - name: Archive published output
        run: Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\WebApp.zip"
        shell: pwsh

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI
          publish-profile: ${{ secrets.AZURE_CREDENTIALS }}
          package: "${{ github.workspace }}\WebApp.zip"
