name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main   # Change if needed

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 4. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GlobaHr-SendEmail-API.sln

      # 5. Build solution with MSBuild
      - name: Build with MSBuild
        run: msbuild GlobaHr-SendEmail-API.sln /p:Configuration=Release /p:Platform="Any CPU"

      # 6. Create publish folder
      - name: Create publish folder
        run: mkdir publish

      # 7. Copy build output (adjust net48 if your project targets net472, net461, etc.)
      - name: Copy build output
        run: xcopy /Y /E "$(Get-Location)\GlobaHr-SendEmail-API\bin\Release\net48\*" publish\

      # 8. Deploy to Azure WebApp
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: "YOUR_AZURE_WEBAPP_NAME"
          package: publish
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
