name: Build and Deploy .NET Framework Web API to Azure

on:
  push:
    branches:
      - main   # change if using a different branch

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Install .NET Framework 4.6.1 Developer Pack
      - name: Install .NET Framework 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      # 4. Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj -SolutionDirectory .

      # 5. Build the project (no MSBuild packaging!)
      - name: Build Project
        run: msbuild GlobaHr-SendEmail-API\GlobaHr-SendEmail-API.csproj /p:Configuration=Release

      # 6. Create publish folder
      - name: Create publish folder
        run: mkdir publish

      # 7. Copy build output
      - name: Copy build output
        run: xcopy /Y /E "${{ github.workspace }}\GlobaHr-SendEmail-API\bin\Release" publish\

      # 8. Create deployment package
      - name: Create deployment package
        run: powershell Compress-Archive -Path publish\* -DestinationPath WebApp.zip

      # 9. Verify package
      - name: Verify package
        run: dir "${{ github.workspace }}\WebApp.zip"

      # 10. Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 11. Deploy to Azure WebApp
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GlobalHr-SendAPI
          package: ${{ github.workspace }}\WebApp.zip
